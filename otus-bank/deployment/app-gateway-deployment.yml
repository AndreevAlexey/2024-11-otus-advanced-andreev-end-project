# Service
apiVersion: v1
kind: Service
metadata:
  name: app-gateway
spec:
  selector:
    app: app-gateway
  ports:
    - protocol: TCP
      port: 8888
      targetPort: 8888
---
# Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-gateway
spec:
  selector:
    matchLabels:
      app: app-gateway
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: app-gateway
    spec:
      containers:
        - image: 127.0.0.1:5000/app-gateway:latest
          name: otus-bank-app-gateway

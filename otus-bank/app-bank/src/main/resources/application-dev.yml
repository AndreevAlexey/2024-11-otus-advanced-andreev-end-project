server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  application:
    name: app-bank

scheduler:
  cron:
    currency: 0 0 8 * * MON-FRI

feign:
  gateway:
    url: http://localhost:8888

logging:
  level:
    root: info

management:
  server:
    port: 8080
  info:
    os:
      enabled: true
    java:
      enabled: true
  metrics:
    enable:
      tomcat: true
      jvm: true
      process: true
      hikaricp: true
      system: true
      jdbc: true
      logback: true
    distribution:
      percentiles:
        http.server.requests: 0.5, 0.9, 0.95, 0.99, 0.999
      slo:
        http.server.requests: 1ms, 10ms, 50ms
      percentiles-histogram:
        http.server.requests: true
  endpoint:
    health:
      show-details: always # show detailed probe results to analyze application state
      show-components: always # list all checks within each group: health, readiness, liveness
      group:
        readiness:
          include: readinessState,diskSpace # external checks to indicate Kubernetes if application is ready for traffic
        liveness:
          include: livenessState # internal checks to indicate Kubernetes if application requires a reboot
      validate-group-membership: false
  export:
    prometheus:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers,features


resilience4j.retry:
  instances:
    default:
      maxAttempts: 3
      waitDuration: 500ms
      retryExceptions:
        - org.springframework.web.client.HttpServerErrorException
        - java.util.concurrent.TimeoutException
        - java.io.IOException

resilience4j.circuitbreaker:
  instances:
    default:
      slidingWindowSize: 10
      permittedNumberOfCallsInHalfOpenState: 3
      slowCallDurationThreshold: 4s
      slowCallRateThreshold: 1
      failureRateThreshold: 1
      waitDurationInOpenState: 5s
      minimumNumberOfCalls: 5

    rate_50_10s:
      sliding-window-type: TIME_BASED
      minimumNumberOfCalls: 5
      failure-rate-threshold: 50
      sliding-window-size: 10
      slowCallRateThreshold: 50
      slowCallDurationThreshold: 200ms
      wait-duration-in-open-state: 5s
      permitted-number-of-calls-in-half-open-state: 1

resilience4j.ratelimiter:
  instances:
    rpm_10:
      limitForPeriod: 10
      limitRefreshPeriod: 1m
      timeoutDuration: 0s

    rps_10:
      limitForPeriod: 10
      limitRefreshPeriod: 1s
      timeoutDuration: 0s
